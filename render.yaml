services:
  - type: web
    name: workspace-prototype
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
